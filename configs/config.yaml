project_name: "AlignForge"
seed: 42
model_name: "Qwen/Qwen2-0.5B-Instruct"
dataset_name: "Anthropic/hh-rlhf"
num_train_samples: 500
num_eval_samples: 50

# LoRA Config
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# Training Config
learning_rate: 5.0e-5
num_epochs: 1
max_length: 256
batch_size: 1
gradient_accumulation_steps: 4
save_strategy: "steps"
save_steps: 50

# DPO Config
beta: 0.1

output_dir: "./results"

# --- Advanced Alignment Configurations ---

# SimPO (Simple Preference Optimization)
simpo:
  beta: 1.0 # 1.0 for Tier A, 2.0 for Tier B
  gamma_beta_ratio: 0.5
  learning_rate: 5e-5
  num_epochs: 1

# --- Research Expansion Additions ---

# Benchmark Tiers: "smoke_test" (10 samples) or "publishable" (500+ samples)
benchmark_tier: "smoke_test"

# Pluggable LLM-as-a-Judge Configuration
judge:
  type: "local" # options: local, openai, openai_compatible
  
  local:
    model: "Qwen/Qwen2-0.5B-Instruct"
    
  openai:
    model: "gpt-4o-mini"
    
  openai_compatible:
    base_url: ""
    api_key: ""
